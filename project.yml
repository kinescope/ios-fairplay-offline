name: FairPlayOffline

options:
  bundleIdPrefix: io.kinescope.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.1"

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

packages:
  FairPlayOfflineKit:
    path: FairPlayOfflineKit

targets:
  FairPlayOffline:
    type: application
    platform: iOS
    sources:
      - path: FairPlayOffline
    dependencies:
      - package: FairPlayOfflineKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kinescope.example.fairplayoffline
        PRODUCT_NAME: FairPlayOffline
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FairPlayOffline/Info.plist
      properties:
        CFBundleDisplayName: FairPlay Offline
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - FairPlayOfflineTests

  FairPlayOfflineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FairPlayOfflineTests
    dependencies:
      - target: FairPlayOffline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.kinescope.example.fairplayoffline.tests
